<!DOCTYPE html>
<html>
<head>
    <title>黃子懿 - 血跡型態模擬器</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        canvas { background: #fff; border: 1px solid #ccc; margin-top: 20px; border-radius: 5px; }
        .slider-group { margin: 15px 0; }
        label { font-weight: bold; color: #1e293b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🩸 血跡型態幾何模擬器</h2>
        <p>公式：sin(θ) = 寬度 / 長度</p>
        <div class="slider-group">
            <label>掉落高度 (cm): <span id="hVal">50</span></label><br>
            <input type="range" id="height" min="10" max="150" value="50">
        </div>
        <div class="slider-group">
            <label>撞擊角度 (度): <span id="aVal">90</span></label><br>
            <input type="range" id="angle" min="10" max="90" value="90">
        </div>
        <canvas id="bloodCanvas" width="400" height="300"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('bloodCanvas');
        const ctx = canvas.getContext('2d');
        const hSlider = document.getElementById('height');
        const aSlider = document.getElementById('angle');

        function draw() {
            const h = hSlider.value;
            const a = aSlider.value;
            document.getElementById('hVal').innerText = h;
            document.getElementById('aVal').innerText = a;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const baseSize = 20 + (h / 5);
            const rad = a * (Math.PI / 180);
            const width = baseSize;
            const length = baseSize / Math.sin(rad);

            ctx.fillStyle = '#991b1b';
            ctx.beginPath();
            // 橢圓繪製，模擬角度變化
            ctx.ellipse(200, 150, length/2, width/2, 0, 0, 2 * Math.PI);
            ctx.fill();

            // 繪製尾巴 (若角度小於 90)
            if (a < 80) {
                ctx.beginPath();
                ctx.moveTo(200 + length/2, 150);
                ctx.lineTo(200 + length, 150);
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#991b1b';
                ctx.stroke();
            }
        }

        hSlider.oninput = draw;
        aSlider.oninput = draw;
        draw();
    </script>
</body>
</html>
