<!DOCTYPE html>
<html>
<head>
    <title>名在雅 - Agentic EDA 分派模擬器</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 50px; }
        .box { background: #1e293b; padding: 20px; border-radius: 10px; display: inline-block; border: 2px solid #3b82f6; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        #result { margin-top: 20px; font-size: 1.2em; color: #10b981; min-height: 30px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🤖 Agentic AI 任務分派模擬器 (L3)</h2>
        <p>請輸入您的晶片設計指令 (例如：優化功耗、進行邏輯合成、檢查佈線)</p>
        <input type="text" id="taskInput" placeholder="輸入指令...">
        <button onclick="assignAgent()">分派任務</button>
        <div id="result"></div>
    </div>
    <script>
        function assignAgent() {
            const task = document.getElementById('taskInput').value.toLowerCase();
            const resultDiv = document.getElementById('result');
            if(task.includes("功耗") || task.includes("power")) {
                resultDiv.innerText = "⚡ 已指派給【Power Signoff Agent (Voltus)】進行優化。";
            } else if (task.includes("合成") || task.includes("synthesis")) {
                resultDiv.innerText = "🧠 已指派給【Logic Synthesis Agent (Genus)】進行處理。";
            } else if (task.includes("佈線") || task.includes("route")) {
                resultDiv.innerText = "🗺️ 已指派給【Place and Route Agent (Innovus)】進行實體佈局。";
            } else {
                resultDiv.innerText = "🔄 指令解析中...已交由【Orchestrating Agent】動態分派。";
            }
        }
    </script>
</body>
</html>
